# Generate Kcal.xcodeproj with XcodeGen: `brew install xcodegen && xcodegen`
name: Kcal
options:
  bundleIdPrefix: com.khushmalde
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  KcalCore:
    path: Packages/KcalCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Kcal:
    type: application
    platform: iOS
    sources: [Kcal]
    dependencies:
      - package: KcalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khushmalde.kcal
        CODE_SIGN_ENTITLEMENTS: $(KCAL_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Kcal/Info.plist
      properties:
        CFBundleDisplayName: Kcal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIImageName: LogoMark
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Kcal uses the camera to scan barcodes, nutrition labels and meals.
        NSHealthShareUsageDescription: Kcal reads your active calories and weight to adjust your daily budget.
        NSHealthUpdateUsageDescription: Kcal saves the food you log and your weigh-ins to Apple Health.
        ITSAppUsesNonExemptEncryption: false
        # Lets CloudKit push changes from your other devices (iCloud builds only).
        UIBackgroundModes: [remote-notification]
        KcalUSDAAPIKey: $(USDA_API_KEY)
        KcalMealPhotoEndpoint: $(MEAL_PHOTO_ENDPOINT)
schemes:
  Kcal:
    build:
      targets:
        Kcal: all
    test:
      targets:
        - package: KcalCore/KcalCoreTests
